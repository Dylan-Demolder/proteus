# Proteus configuration
#
#   proteus proxy --config config.yaml
#   proteus file big.json --config config.yaml
#
# Every value here is the built-in default; delete what you don't change.
# Unknown keys and wrongly typed values are errors, not silently ignored.
# The proxy re-reads this file when it changes (the proxy: section needs a
# restart). Library users: proteus.config.configure("config.yaml").

# Start from a profile (conservative | balanced | aggressive); keys below
# override it. `--profile` on the command line overrides this line.
# profile: balanced

# ── Routing ──
min_compress_chars: 3000

# ── JSON Crusher ──
json:
  max_rows_before_drop: 200
  drop_head: 10
  drop_tail: 10
  auto_columnar: true
  columnar_min_rows: 5

# ── Log Deduper ──
logs:
  min_repetitions: 3
  keep_first_last: true
  max_lines_total: 200

# ── File Listing ──
file_listing:
  strip_perms: true
  strip_owner: true

# ── Text Summarizer ──
text:
  max_chars: 10000
  head_chars: 2000
  tail_chars: 2000

# ── Search Results ──
search:
  max_per_file: 5
  max_total: 30
  max_files: 15

# ── Diff ──
diff:
  max_context_lines: 2
  max_hunks_per_file: 10
  max_files: 20

# ── Proxy ──
proxy:
  host: "127.0.0.1"
  port: 8787
  # Supported backends:
  #   openrouter   — OpenRouter (https://openrouter.ai/api/v1), uses OPENROUTER_API_KEY
  #   opencode-go  — OpenCode Go (https://opencode.ai/zen/go/v1), uses OPENCODE_GO_API_KEY
  #   openai       — OpenAI API (https://api.openai.com/v1), uses OPENAI_API_KEY
  #   generic      — Custom endpoint, uses --upstream-url and --api-key-env
  backend: "opencode-go"

# ── CCR Cache ──
ccr:
  max_entries: 500
  cache_dir: "~/.proteus/cache/"
