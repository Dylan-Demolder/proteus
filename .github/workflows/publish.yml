name: Publish to PyPI

# Uses PyPI Trusted Publishing (OIDC) — no API token or long-lived secret.
# One-time setup required on pypi.org before the first run:
#   https://pypi.org/manage/project/proteus-compress/settings/publishing/
#   Add a "trusted publisher" with:
#     Owner:      Dylan-Demolder
#     Repository: proteus
#     Workflow:   publish.yml
#     Environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check --strict dist/*

      - name: Verify wheel installs and imports
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/python -c "import proteus; from proteus import compress_tool_output; print('import OK')"
          /tmp/verify/bin/proteus --help > /dev/null
          echo "entry point OK"

      - name: Check version matches release tag
        if: github.event_name == 'release'
        run: |
          pkg_version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag" ]; then
            echo "::error::pyproject version ($pkg_version) != release tag ($tag). Tag releases as v$pkg_version."
            exit 1
          fi
          echo "version $pkg_version matches tag"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/proteus-compress
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Fail loudly if the name is already taken or version exists
          skip-existing: false
          verbose: true
