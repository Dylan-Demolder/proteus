version: 2
updates:
  # GitHub Actions — keeps checkout/setup-python/publish actions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]

  # pip — pyproject.toml dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    ignore:
      # aiohttp major bumps have broken the proxy before; review those by hand
      - dependency-name: "aiohttp"
        update-types: ["version-update:semver-major"]
